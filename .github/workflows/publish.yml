name: Publish
on:
  release:
    types: [created]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semver tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"
          # Must match vX.Y.Z format
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must follow semantic versioning (vX.Y.Z)"
            exit 1
          fi

      - name: Validate package version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_VERSION="${TAG_NAME#v}"
          
          echo "Tag version: $EXPECTED_VERSION"
          echo "Package version: $PACKAGE_VERSION"
          
          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Error: Package version ($PACKAGE_VERSION) doesn't match tag version ($EXPECTED_VERSION)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
